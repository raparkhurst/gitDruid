[package]
name = "git-druid"
version = "0.0.5"
edition = "2024"
description = "A cross-platform git GUI desktop client"
license = "MIT"

[[bin]]
name = "git-druid"
path = "src/main.rs"

[dependencies]
# git2 ships with no transports enabled; without these there is nothing
# for fetch, pull or push to talk to.
git2 = { version = "0.21.0", features = ["ssh", "https"] }
iced = { version = "0.14.0", features = ["canvas", "lazy", "image-without-codecs"] }
# The splash is the only image in the application, and it is a JPEG. iced's
# "image" feature would pull in a decoder for every format there is; this
# enables the one that gets used.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = "0.17.2"

[features]
# Builds libgit2 and OpenSSL from source rather than linking whatever the
# distribution ships. Slower to build, and the point of it: a binary that runs
# on RHEL 9 and on Ubuntu 25.04 without caring which libgit2 either has.
bundled = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
